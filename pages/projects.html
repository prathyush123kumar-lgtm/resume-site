<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Projects by E. Prathyush Kumar — Document Converter, Lectures Website, Personal Resume Site." />
  <title>Projects — E. Prathyush Kumar</title>
  <link rel="icon" href="/public/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles/global.css" />
  <link rel="stylesheet" href="/styles/components.css" />
  <link rel="stylesheet" href="/styles/animations.css" />
  <script>(function(){var s=localStorage.getItem('theme')||'light';document.documentElement.setAttribute('data-theme',s);})();</script>
</head>
<body>
  <div id="scroll-progress" aria-hidden="true"></div>
  <div class="toast-container" id="toast-container" aria-live="polite"></div>
  <div class="modal-overlay" id="modal" role="dialog" aria-modal="true" aria-label="Project screenshot">
    <button class="modal-close" id="modal-close" aria-label="Close">✕</button>
    <img class="modal-img" id="modal-img" src="" alt="" />
  </div>

  <header>
    <nav class="navbar" id="navbar" aria-label="Main navigation">
      <div class="nav-inner">
        <a href="/pages/index.html" class="nav-logo"><div class="logo-badge" aria-hidden="true">EP</div><span>Prathyush Kumar</span></a>
        <ul class="nav-links" role="list">
          <li><a href="/pages/index.html">Home</a></li>
          <li><a href="/pages/index.html#about">About</a></li>
          <li><a href="/pages/index.html#skills">Skills</a></li>
          <li><a href="/pages/projects.html" class="active" aria-current="page">Projects</a></li>
          <li><a href="/pages/index.html#contact">Contact</a></li>
          <li><a href="/pages/links.html">Links</a></li>
        </ul>
        <div class="nav-actions">
          <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode"><span id="theme-icon">🌙</span></button>
          <button class="hamburger" id="hamburger" aria-label="Open menu" aria-expanded="false"><span></span><span></span><span></span></button>
        </div>
      </div>
    </nav>
    <nav class="nav-mobile" id="nav-mobile" aria-label="Mobile navigation">
      <a href="/pages/index.html">Home</a>
      <a href="/pages/index.html#about">About</a>
      <a href="/pages/index.html#skills">Skills</a>
      <a href="/pages/projects.html">Projects</a>
      <a href="/pages/index.html#contact">Contact</a>
      <a href="/pages/links.html">Links</a>
    </nav>
  </header>

  <main style="padding-top:var(--navbar-height)">
    <section class="section" aria-label="All projects">
      <div class="container">
        <div class="section-header animate-on-scroll animate-fade-up">
          <span class="section-label">What I've Built</span>
          <h1 class="section-title">All Projects</h1>
          <div class="divider" aria-hidden="true"></div>
          <p class="section-subtitle">Every project tells a story of a problem I wanted to solve.</p>
        </div>

        <div class="projects-filter" role="group" aria-label="Filter projects">
          <button class="filter-btn active" data-filter="all"         aria-pressed="true" >All</button>
          <button class="filter-btn"         data-filter="web"        aria-pressed="false">Web</button>
          <button class="filter-btn"         data-filter="python"     aria-pressed="false">Python</button>
          <button class="filter-btn"         data-filter="in-progress" aria-pressed="false">In Progress</button>
        </div>

        <div class="projects-grid stagger-children" id="projects-grid" aria-live="polite">
          <p class="text-center text-muted" style="grid-column:1/-1">Loading projects…</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer" aria-label="Site footer">
    <div class="container">
      <div class="footer-bottom">
        <p>© 2026 E. Prathyush Kumar</p>
        <button id="back-to-top" aria-label="Back to top">↑</button>
      </div>
    </div>
  </footer>

  <script src="/scripts/theme-toggle.js"></script>
  <script src="/scripts/navbar.js"></script>
  <script src="/scripts/scroll-anim.js"></script>
  <script src="/scripts/fetch-data.js"></script>
  <script src="/scripts/lightbox.js"></script>
  <script src="/scripts/smooth-scroll.js"></script>
</body>
</html>
