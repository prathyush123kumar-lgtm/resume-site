<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found</title>
  <link rel="stylesheet" href="../styles/global.css">
  <style>
    .not-found-section {
      height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .not-found-content h1 {
      font-size: 5rem;
      margin: 0;
      color: var(--color-primary);
    }
    .not-found-content p {
      font-size: 1.2rem;
      margin-bottom: 30px;
    }
  </style>
</head>
<body>
  <header>
    <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
      <h1 class="logo">EPK</h1>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><button id="themeBtn" class="btn">Toggle Theme</button></li>
        </ul>
      </nav>
    </div>
  </header>

  <section class="not-found-section">
    <div class="not-found-content">
      <h1>404</h1>
      <h2>Oops! Page Not Found</h2>
      <p>The page you are looking for doesn't exist or has been moved.</p>
      <a href="index.html" class="btn btn-primary">Return Home</a>
    </div>
  </section>

  <footer>
    <div class="container" style="text-align: center; padding: 20px; border-top: 1px solid var(--color-secondary); margin-top: 50px;">
      <p>&copy; 2026 E Prathyush Kumar. All rights reserved.</p>
    </div>
  </footer>

  <script>
    // Minimal theme logic for 404 page
    const themeBtn = document.getElementById('themeBtn');
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme) {
      document.documentElement.setAttribute('data-theme', savedTheme);
    }
    themeBtn.addEventListener('click', () => {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
    });
  </script>
</body>
</html>
