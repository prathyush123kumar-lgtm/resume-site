<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E Prathyush Kumar - Portfolio</title>
  <link rel="stylesheet" href="../styles/global.css">
</head>
<body>
  <nav class="navbar">
    <div class="logo">EPK</div>
    <div class="nav-links">
      <a href="#about">About</a>
      <a href="#projects">Projects</a>
      <a href="#resume">Resume</a>
      <button id="themeBtn">Toggle Theme</button>
    </div>
  </nav>

  <header class="hero" id="about">
    <div class="container">
      <h1>Hi, I'm <span class="highlight">E Prathyush Kumar</span></h1>
      <h2>B.Tech Information Science Student & Web Developer</h2>
      <p id="summary-text">Loading...</p>
      <div class="actions">
        <a href="#projects" class="btn btn-primary">View My Work</a>
        <a href="https://github.com/prathyush123kumar-lgtm" class="btn btn-secondary">GitHub</a>
      </div>
    </div>
  </header>

  <section class="projects-section" id="projects">
    <div class="container">
      <h2>Featured Projects</h2>
      <div id="project-filters" class="filters">
        <!-- Filters loaded via JS -->
      </div>
      <div class="projects-grid" id="projects-container">
        <!-- Skeleton Loaders -->
        <div class="skeleton skeleton-card"></div>
        <div class="skeleton skeleton-card"></div>
        <div class="skeleton skeleton-card"></div>
      </div>
    </div>
  </section>

  <section class="resume-section" id="resume">
    <div class="container">
      <h2>Education & Skills</h2>
      <div class="timeline" id="skills-container">
        <!-- Skeleton Loaders -->
        <div class="skeleton skeleton-timeline"></div>
        <div class="skeleton skeleton-timeline"></div>
        <div class="skeleton skeleton-timeline"></div>
      </div>
    </div>
  </section>

  <section class="contact-section" id="contact">
    <div class="container">
      <h2>Contact Me</h2>
      <form id="contact-form" class="contact-form">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" required></textarea>
        </div>
        <!-- Cloudflare Turnstile Placeholder -->
        <div class="cf-turnstile" data-sitekey="1x00000000000000000000AA"></div>
        <button type="submit" class="btn btn-primary" id="contact-submit">Send Message</button>
        <p id="contact-status"></p>
      </form>
    </div>
  </section>

  <footer>
    <div class="container">
      <p>&copy; 2026 E Prathyush Kumar. All rights reserved.</p>
    </div>
  </footer>

  <!-- Command Palette Modal -->
  <dialog id="command-palette" class="command-palette">
    <div class="palette-content">
      <input type="text" id="palette-search" placeholder="Search projects or commands... (e.g. 'Theme', 'Projects')" autocomplete="off">
      <ul id="palette-results"></ul>
    </div>
  </dialog>

  <script src="../scripts/main.js"></script>
</body>
</html>
